name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: Statistiques, modèles et assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  database:
    name: Sécurité de la base (RLS) et migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le script
        run: sed 's/__ADMIN_EMAIL__/admin@test.ma/g' supabase_setup.sql > /tmp/setup.sql
      - name: Installation neuve (deux exécutions pour vérifier l'idempotence)
        run: |
          createdb fresh
          psql -v ON_ERROR_STOP=1 -q -d fresh -f tests/sql/supabase_mock.sql
          psql -v ON_ERROR_STOP=1 -q -d fresh -f /tmp/setup.sql
          psql -v ON_ERROR_STOP=1 -q -d fresh -f /tmp/setup.sql
      - name: Tests de sécurité
        run: psql -v ON_ERROR_STOP=1 -q -d fresh -f tests/sql/rls.test.sql
      - name: Migration depuis la version 2
        run: |
          createdb upgrade
          psql -v ON_ERROR_STOP=1 -q -d upgrade -f tests/sql/supabase_mock.sql
          psql -v ON_ERROR_STOP=1 -q -d upgrade -f tests/sql/migration_v2.sql
          psql -v ON_ERROR_STOP=1 -q -d upgrade -f /tmp/setup.sql
          psql -v ON_ERROR_STOP=1 -q -d upgrade -f tests/sql/migration.test.sql
